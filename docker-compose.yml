services:
  pipeline:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data:ro
    environment:
      - PIPELINE_HMAC_SECRET=${PIPELINE_HMAC_SECRET}
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m src.pipeline"

  test:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data:ro
    environment:
      - PIPELINE_HMAC_SECRET=test-secret
    command: >
      sh -c "pip install -r requirements.txt &&
             pytest tests/ -v --cov=src --cov-report=term-missing"
