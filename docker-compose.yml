services:
  pipeline:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data:ro
      - ./output:/app/output
      - ./audit:/app/audit
    environment:
      - PIPELINE_HMAC_SECRET=${PIPELINE_HMAC_SECRET}
    command: python -m src.pipeline

  test:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PIPELINE_HMAC_SECRET=test-secret
    command: pytest tests/ -v --cov=src --cov-report=term-missing
