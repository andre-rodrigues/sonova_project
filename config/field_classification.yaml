# field_classification.yaml
#
# Classifies every column in every source table by PII tier and treatment.
# The governance module validates at pipeline startup that all DataFrame columns
# appear here; any column not listed raises ValueError (fail-fast).
#
# Tiers: PII-SC | PII-S | PII | IND | SAFE
# Treatments:
#   exclude            — drop from all silver outputs
#   pseudonymise       — HMAC-SHA256 hex[:16]; stored in restricted, excluded from internal
#   generalise_to_year — extract year (int) only; stored in internal as birth_year
#   redact             — regex-redact free text; result stored in internal; PII-SC tier
#                        fields are still excluded from internal even after redaction
#   passthrough        — stored as-is
#
# Note: columns prefixed with _ (_ingested_at, _source_file) are pipeline metadata
# added by the bronze loader and are skipped by manifest validation.

successfactors:

  employees:
    employee_id:
      tier: IND
      treatment: passthrough   # cross-system spine; pseudonymised via surrogate key
    user_id:
      tier: PII
      treatment: pseudonymise  # SSO/login handle
    hire_date:
      tier: SAFE
      treatment: passthrough
    termination_date:
      tier: SAFE
      treatment: passthrough
    employment_status:
      tier: SAFE
      treatment: passthrough
    employment_type:
      tier: SAFE
      treatment: passthrough
    company_code:
      tier: SAFE
      treatment: passthrough
    created_at:
      tier: SAFE
      treatment: passthrough
    last_modified:
      tier: SAFE
      treatment: passthrough

  employee_personal:
    employee_id:
      tier: IND
      treatment: passthrough
    first_name:
      tier: PII
      treatment: pseudonymise
    last_name:
      tier: PII
      treatment: pseudonymise
    date_of_birth:
      tier: PII
      treatment: generalise_to_year  # only birth_year (int) in internal
    gender:
      tier: PII-SC
      treatment: exclude             # GDPR Art. 9 — never stored in any silver layer
    nationality:
      tier: PII-SC
      treatment: exclude             # often treated as ethnic-origin proxy
    marital_status:
      tier: PII-SC
      treatment: exclude             # family status — restricted under local laws
    national_id:
      tier: PII-S
      treatment: pseudonymise        # AHV, INSEE, NINO, Aadhaar, etc.
    national_id_type:
      tier: PII-S
      treatment: pseudonymise        # reveals ID scheme; pseudonymise alongside national_id
    last_modified:
      tier: SAFE
      treatment: passthrough

  employee_contact:
    contact_detail_id:
      tier: SAFE
      treatment: passthrough
    employee_id:
      tier: IND
      treatment: passthrough
    contact_type:
      tier: SAFE
      treatment: passthrough
    contact_value:
      tier: PII
      treatment: pseudonymise        # email address or phone number
    is_primary:
      tier: SAFE
      treatment: passthrough
    last_modified:
      tier: SAFE
      treatment: passthrough

  employee_job:
    job_entry_id:
      tier: SAFE
      treatment: passthrough
    employee_id:
      tier: IND
      treatment: passthrough
    job_code:
      tier: SAFE
      treatment: passthrough
    department_id:
      tier: SAFE
      treatment: passthrough
    location_id:
      tier: SAFE
      treatment: passthrough
    manager_id:
      tier: IND
      treatment: passthrough         # references employee_id spine
    effective_date:
      tier: SAFE
      treatment: passthrough
    end_date:
      tier: SAFE
      treatment: passthrough
    reason:
      tier: SAFE
      treatment: passthrough
    fte:
      tier: SAFE
      treatment: passthrough
    last_modified:
      tier: SAFE
      treatment: passthrough

  employee_compensation:
    comp_entry_id:
      tier: SAFE
      treatment: passthrough
    employee_id:
      tier: IND
      treatment: passthrough
    effective_date:
      tier: SAFE
      treatment: passthrough
    base_salary:
      tier: PII-S
      treatment: pseudonymise        # personal financial data (Swiss DSG, German BDSG)
    currency:
      tier: SAFE
      treatment: passthrough
    pay_frequency:
      tier: SAFE
      treatment: passthrough
    bonus_target_pct:
      tier: PII-S
      treatment: pseudonymise
    comp_grade:
      tier: PII-S
      treatment: pseudonymise
    last_modified:
      tier: SAFE
      treatment: passthrough

  departments:
    department_id:
      tier: SAFE
      treatment: passthrough
    department_name:
      tier: SAFE
      treatment: passthrough
    cost_center:
      tier: IND
      treatment: passthrough         # indirect — can narrow to a small group
    parent_department_id:
      tier: SAFE
      treatment: passthrough
    manager_employee_id:
      tier: IND
      treatment: passthrough
    status:
      tier: SAFE
      treatment: passthrough

  job_codes:
    job_code:
      tier: SAFE
      treatment: passthrough
    job_title:
      tier: SAFE
      treatment: passthrough
    job_family:
      tier: SAFE
      treatment: passthrough
    grade_level:
      tier: SAFE
      treatment: passthrough
    is_manager_role:
      tier: SAFE
      treatment: passthrough

  locations:
    location_id:
      tier: SAFE
      treatment: passthrough
    location_name:
      tier: SAFE
      treatment: passthrough
